<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="FM monogram">
  <style>
    .bg { fill: #f6f5f3; }
    .fg { fill: #1a1a1a; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #14171a; }
      .fg { fill: #e8e6e1; }
    }
  </style>
  <rect class="bg" x="0" y="0" width="64" height="64" rx="8"/>
  <text class="fg" x="32" y="42" font-family="Georgia, 'Iowan Old Style', serif" font-size="28" font-weight="700" text-anchor="middle">FM</text>
</svg>
